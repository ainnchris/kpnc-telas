name: Chamada real na prévia

on:
  push:
    branches: [feat/meet-next]
    paths:
      - public/**
      - worker/**
      - scripts/test-live-preview.cjs
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/live-preview-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kpnc-meet-live-preview
  cancel-in-progress: true

jobs:
  encrypted-browser-call:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Testar chamada E2EE com dois navegadores
        run: pnpm run test:preview:live
