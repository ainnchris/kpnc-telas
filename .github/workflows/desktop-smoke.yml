name: Abertura do aplicativo Windows
on:
  push:
    branches: [feat/meet-multiplataforma]
    paths: [apps/desktop/**, .github/workflows/desktop-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --filter kpnc-meet-desktop... --frozen-lockfile
      - run: node apps/desktop/node_modules/electron/install.js
      - name: Abrir site em janela oculta com sandbox e sem acesso aos dispositivos
        timeout-minutes: 3
        run: node apps/desktop/node_modules/electron/cli.js apps/desktop --smoke-test
